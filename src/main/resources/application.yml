spring:
  application:
    name: sigurna-razmjena
  datasource:
    url: jdbc:h2:file:./data/as2db;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

as2:
  folders:
    outbox: ./openas2-work/partnerA/outbox
    sent: ./openas2-work/partnerA/sent
    mdn: ./openas2-work/partnerA/mdn
    error: ./openas2-work/partnerA/error
    processed: ./openas2-work/partnerA/processed
    partner-b-inbox: ./openas2-work/partnerB/inbox